name: Deploy Production

# Render (backend) et Vercel (frontend / back-office) sont liés au repo GitHub :
# push sur main → auto-deploy par leurs intégrations Git natives (aucun token de
# déploiement n'est nécessaire, ce workflow ne déploie donc rien lui-même).
# Backend : service Render « estimer-mes-aides-api », plan free, région frankfurt,
# rootDir src/backend, healthCheckPath /health, autoDeploy sur main.
# Ce workflow s'occupe de : tests + migration DB + healthcheck + build APK + tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (urgence hotfix)'
        type: boolean
        default: false
      skip_migration:
        description: 'Skip Prisma migrate deploy'
        type: boolean
        default: false
      skip_healthcheck:
        description: "Skip healthcheck (n'attend pas le redéploiement Render)"
        type: boolean
        default: false
      skip_webview:
        description: 'Skip Android WebView build'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. SYNC — Cohérence repo (lockfiles)
  # ─────────────────────────────────────────────────────────────
  sync:
    name: Sync repo & install
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify lockfiles present
        run: |
          for dir in src/backend src/frontend src/backoffice; do
            test -f "$dir/package-lock.json" || { echo "Missing lockfile in $dir"; exit 1; }
          done

  # ─────────────────────────────────────────────────────────────
  # 2. TESTS — Backend Jest (596 tests)
  # ─────────────────────────────────────────────────────────────
  tests:
    name: Tests backend — 596 tests Jest
    needs: sync
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_tests != true }}
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_MOBILE: ${{ secrets.API_KEY_MOBILE }}
          API_KEY_CRM: ${{ secrets.API_KEY_CRM }}

  # ─────────────────────────────────────────────────────────────
  # 3. MIGRATION — Prisma migrate deploy (sur Supabase prod)
  # ─────────────────────────────────────────────────────────────
  migrate:
    name: Migration DB Prisma
    needs: [sync, tests]
    if: ${{ always() && needs.sync.result == 'success' && (needs.tests.result == 'success' || inputs.skip_tests == true) && inputs.skip_migration != true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - name: prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          # DIRECT_URL = pooler session port 5432 (IPv4, requis pour migrate)
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  # ─────────────────────────────────────────────────────────────
  # 4. HEALTHCHECK — Attend que Render ait redéployé le backend
  # ─────────────────────────────────────────────────────────────
  healthcheck:
    name: Healthcheck backend (Render auto-deploy)
    needs: [tests, migrate]
    if: ${{ always()
        && (needs.tests.result == 'success' || (needs.tests.result == 'skipped' && inputs.skip_tests == true))
        && (needs.migrate.result == 'success' || (needs.migrate.result == 'skipped' && inputs.skip_migration == true))
        && inputs.skip_healthcheck != true }}
    runs-on: ubuntu-latest
    # 15 min d'attente max (MAX_WAIT) + la dernière requête (75 s) + l'overhead
    # du runner : 18 min laissent la boucle rendre son propre message d'erreur
    # plutôt que d'être tuée par le timeout du job.
    timeout-minutes: 18
    steps:
      - name: Wait for Render redeploy + /health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Un secret absent ne doit JAMAIS produire un healthcheck vert :
          # le déploiement serait tagué "sain" sans qu'aucune requête n'ait été faite.
          if [ -z "$BACKEND_URL" ]; then
            echo "::error title=Secret BACKEND_URL manquant::Le healthcheck n'a rien pu vérifier."
            echo "Renseignez le secret BACKEND_URL (Settings > Secrets and variables > Actions),"
            echo "ou relancez le workflow avec skip_healthcheck=true pour assumer explicitement l'absence de vérification."
            exit 1
          fi

          # Budget d'attente — plan Render free :
          #   build + redeploy après push .......... 2 à 5 min
          #   réveil à froid (service endormi
          #   après 15 min d'inactivité) ........... ~50 s SUR LA REQUÊTE ELLE-MÊME
          # D'où --max-time 75 : la requête de réveil doit pouvoir aboutir. Avec
          # l'ancien --max-time 10, curl coupait systématiquement le réveil et le
          # job échouait sur un backend pourtant sain.
          # --connect-timeout 10 garde les tentatives « service pas encore là »
          # rapides (connexion refusée) pour ne pas gaspiller le budget.
          # MAX_WAIT 900 s = 15 min : couvre redeploy (5 min) + réveil (1 min)
          # avec une marge x2, soit ~40 tentatives en échec rapide et au moins
          # 10 tentatives dans le pire cas (chaque requête bloquée 75 s).
          # DELAY 20 s : au-delà d'une dizaine de tentatives, un intervalle plus
          # court n'accélère rien (c'est Render qui build) et ne fait que
          # multiplier les requêtes sur une instance en cours de réveil.
          # -f : tout code HTTP non-2xx (dont le 503 « base KO » de /health)
          # fait échouer curl, donc la tentative — jamais un faux vert.
          MAX_WAIT=900
          DELAY=20
          started=$SECONDS
          attempt=0
          while [ $(( SECONDS - started )) -lt "$MAX_WAIT" ]; do
            attempt=$(( attempt + 1 ))
            if curl -fsS --connect-timeout 10 --max-time 75 "$BACKEND_URL/health"; then
              echo ""
              echo "✓ Backend healthy après $(( SECONDS - started ))s ($attempt tentative(s))"
              exit 0
            fi
            echo "Tentative $attempt KO à $(( SECONDS - started ))s — nouvelle tentative dans ${DELAY}s..."
            sleep "$DELAY"
          done
          echo "::error title=Backend injoignable::/health n'a pas répondu 2xx en ${MAX_WAIT}s ($attempt tentatives)"
          exit 1

  # ─────────────────────────────────────────────────────────────
  # 5. WEBVIEW — Build APK Android (versionName ← frontend package.json)
  # ─────────────────────────────────────────────────────────────
  build-webview:
    name: Build Android WebView APK
    needs: [sync, healthcheck]
    if: ${{ always()
        && needs.sync.result == 'success'
        && (needs.healthcheck.result == 'success' || needs.healthcheck.result == 'skipped')
        && inputs.skip_webview != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Récupérer l'historique complet pour `git rev-list --count HEAD` → versionCode monotone
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # Le repo n'a que gradlew.bat — installer gradle directement.
      # Cache Gradle actif (comportement par défaut de setup-gradle@v6).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'

      # 1/3 — Build frontend production (assets bundlés dans l'APK)
      - name: Build frontend (mode production)
        working-directory: src/frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
          VITE_API_KEY: ${{ secrets.API_KEY_MOBILE }}
          # Sans ces deux variables AU MOMENT DU BUILD, le tree-shaking Vite reduit
          # connectBorneChannel() a un no-op : le forcage login/logout d'une borne
          # depuis le back-office cesse de fonctionner sur les tablettes, en silence.
          VITE_PUSHER_KEY: ${{ secrets.VITE_PUSHER_KEY }}
          VITE_PUSHER_CLUSTER: ${{ secrets.VITE_PUSHER_CLUSTER }}
        run: |
          npm ci
          npm run build
          ls -la dist/
          # Garde-fou : l'APK ne doit jamais partir sans le pilotage temps reel.
          test "$(grep -ro 'force-login' dist/assets/ | wc -l)" -gt 0             || { echo "::error::force-login absent du bundle — VITE_PUSHER_KEY manquante au build"; exit 1; }

      # 2/3 — Copier le build frontend dans les assets de la WebView
      - name: Copy frontend dist → android assets
        run: |
          rm -rf android-webview/app/src/main/assets
          mkdir -p android-webview/app/src/main/assets
          cp -r src/frontend/dist/* android-webview/app/src/main/assets/
          echo "Assets contents:"
          ls -la android-webview/app/src/main/assets/

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android-webview/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-webview/keystore/release.keystore
          cat > android-webview/keystore/keystore.properties <<EOF
          storeFile=../keystore/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Compute version (sync avec frontend)
        id: version
        run: |
          FRONT_VERSION=$(node -p "require('./src/frontend/package.json').version")
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$FRONT_VERSION" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE"  >> $GITHUB_OUTPUT
          echo "APK versionName=$FRONT_VERSION  versionCode=$VERSION_CODE"

      # 3/3 — Build APK avec le frontend prod embarqué
      - name: Build APK
        working-directory: android-webview
        run: |
          if [ -f keystore/release.keystore ]; then
            gradle assembleRelease --no-daemon -PversionCodeOverride=${{ steps.version.outputs.code }}
          else
            echo "Pas de keystore — build debug"
            gradle assembleDebug --no-daemon -PversionCodeOverride=${{ steps.version.outputs.code }}
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: webview-apk-${{ needs.sync.outputs.short_sha }}
          path: |
            android-webview/app/build/outputs/apk/release/*.apk
            android-webview/app/build/outputs/apk/debug/*.apk
          # `error` et pas `warn` : un build sans APK produit doit faire échouer
          # le job, sinon `finalize` taguerait un déploiement sans livrable.
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # 6. TAG — git tag + résumé
  # ─────────────────────────────────────────────────────────────
  finalize:
    name: Tag & summary
    needs: [sync, tests, migrate, healthcheck, build-webview]
    if: ${{ always()
        && needs.sync.result == 'success'
        && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
        && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
        && (needs.healthcheck.result == 'success' || needs.healthcheck.result == 'skipped')
        && (needs.build-webview.result == 'success'
            || (needs.build-webview.result == 'skipped' && inputs.skip_webview == true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag deployment
        run: |
          TAG="deploy-$(date -u +%Y%m%d-%H%M%S)-${{ needs.sync.outputs.short_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production deploy ${{ needs.sync.outputs.short_sha }}"
          git push origin "$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Summary
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ✅ Déploiement réussi

          | Étape | Statut |
          |-------|--------|
          | Tests backend | ${{ needs.tests.result }} |
          | Migration DB | ${{ needs.migrate.result }} |
          | Healthcheck Render | ${{ needs.healthcheck.result }} |
          | WebView APK | ${{ needs.build-webview.result }} |

          - **Commit** : \`${{ needs.sync.outputs.short_sha }}\`
          - **Tag** : \`$TAG\`
          - **Backend (Render)** : $BACKEND_URL — auto-déployé via intégration Git
          - **Vercel** : auto-déployé via intégration Git (frontend / backoffice)
          EOF
